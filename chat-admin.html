<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Albielle — настройки чата</title><style>*{box-sizing:border-box}body{margin:0;background:#24201d;color:#f4e6ce;font:15px system-ui}main{max-width:1050px;margin:auto;padding:20px;display:grid;grid-template-columns:1fr 440px;gap:24px}section{background:#332b25;padding:18px;border-radius:12px}label{display:block;margin:12px 0}input[type=range]{width:100%;accent-color:#bc8266}input[type=color]{float:right}button,textarea,input[type=text]{font:inherit;padding:9px;border:1px solid #94765b;border-radius:6px;background:#46382e;color:white}textarea,input[type=text]{width:100%}button{cursor:pointer;margin:5px 4px 5px 0}iframe{width:100%;height:650px;border:0;background:#51483e}output{float:right}small{display:block;line-height:1.5}@media(max-width:850px){main{grid-template-columns:1fr}}</style><main><section><h1>Настройки чата Albielle</h1><p>Льняная вышивка · OBS</p><div id="controls"><label>Размер сообщения<output id="o-text"></output><input type="range" id="text" min="10" max="30"></label><label>Размер ника<output id="o-nick"></output><input type="range" id="nick" min="10" max="28"></label><label>Жирность сообщения<output id="o-textWeight"></output><input type="range" id="textWeight" min="400" max="900" step="100"></label><label>Жирность ника<output id="o-nickWeight"></output><input type="range" id="nickWeight" min="400" max="900" step="100"></label><label>Цвет сообщения<input type="color" id="textColor"></label><label><input type="checkbox" id="roleNick"> Цвет ника по роли</label><label>Цвет ника (если цвет по роли отключён)<input type="color" id="nickColor"></label><label>Усиление контура текста, %<output id="o-contrast"></output><input type="range" id="contrast" min="0" max="100"></label><label>Непрозрачность плашек, %<output id="o-opacity"></output><input type="range" id="opacity" min="20" max="100"></label><label>Интенсивность текстуры, %<output id="o-texture"></output><input type="range" id="texture" min="0" max="100"></label><label>Интервал, px<output id="o-gap"></output><input type="range" id="gap" min="0" max="30"></label><label>Появление, мс<output id="o-appear"></output><input type="range" id="appear" min="0" max="1500"></label><label>Смещение, мс<output id="o-move"></output><input type="range" id="move" min="0" max="1500"></label><label>Стример<input type="color" id="owner"></label><label>Модератор<input type="color" id="mod"></label><label>VIP<input type="color" id="vip"></label><label>Подписчик<input type="color" id="sub"></label><label>Зритель<input type="color" id="viewer"></label><label><input type="checkbox" id="embroidery"> Вышивка</label><label><input type="checkbox" id="symbols"> Символы</label><label><input type="checkbox" id="particles"> Частицы</label><label>Дополнительные боты (через запятую или пробел)<textarea id="extraBots"></textarea></label></div><button id="reset">Сбросить</button><button id="copy">Копировать ссылку для OBS</button><input type="text" id="url" readonly><small id="status">Настройки сохраняются в этом браузере. Для OBS в другом браузерном профиле скопируйте ссылку с настройками и вставьте её в источник. После изменений повторите копирование.</small></section><section><h2>Предпросмотр</h2><iframe id="preview" src="chat.html?preview=1"></iframe></section></main><script>const defaults={text:17,nick:16,textWeight:700,nickWeight:800,textColor:'#21150f',nickColor:'#21150f',roleNick:true,contrast:20,opacity:100,texture:100,gap:11,appear:550,move:420,owner:'#9e343b',mod:'#38694d',vip:'#9c416b',sub:'#365f91',viewer:'#776747',embroidery:true,symbols:true,particles:true,extraBots:''};const key='albielle-chat-settings-v1';function clean(v){let o={...defaults};for(const k in defaults){if(typeof defaults[k]==='number'){let n=Number(v[k]);if(v[k]!=null&&Number.isFinite(n))o[k]=k==='textWeight'||k==='nickWeight'?Math.max(400,Math.min(900,n)):k==='contrast'?Math.max(0,Math.min(100,n)):Math.max(0,Math.min(2000,n))}else if(typeof defaults[k]==='boolean'){if(typeof v[k]==='boolean')o[k]=v[k]}else if(k==='extraBots'){if(typeof v[k]==='string')o[k]=v[k].slice(0,4000)}else if(/^#[0-9a-f]{6}$/i.test(v[k]||''))o[k]=v[k]}return o}function load(){try{return clean(JSON.parse(localStorage.getItem(key)||'{}'))}catch{return {...defaults}}}let v=load();const $=id=>document.getElementById(id);function render(){for(const k in defaults){const el=$(k);if(el.type==='checkbox')el.checked=v[k];else el.value=v[k];if($('o-'+k))$('o-'+k).textContent=v[k]}sync()}function sync(){try{localStorage.setItem(key,JSON.stringify(v))}catch{}$('preview').contentWindow.postMessage({type:'albielle-settings',value:v},'*');const u=new URL('chat.html',location.href);u.searchParams.set('settings',JSON.stringify(v));$('url').value=u.href}for(const k in defaults)$(k).addEventListener('input',()=>{const el=$(k);v[k]=el.type==='checkbox'?el.checked:el.type==='range'?Number(el.value):el.value;if($('o-'+k))$('o-'+k).textContent=v[k];sync()});$('preview').addEventListener('load',sync);$('reset').onclick=()=>{v={...defaults};render()};$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('url').value);$('status').textContent='Ссылка скопирована. Вставьте её в источник OBS.'}catch{$('url').select();$('status').textContent='Скопируйте выделенную ссылку вручную.'}};render();</script></html>
