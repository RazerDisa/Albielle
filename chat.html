d="stream"></div></section><aside><h2>Льняная вышивка • V5</h2><label for="theme">Стиль чата</label><select id="theme"><option value="linen">1. Фактурная льняная вышивка</option><option value="rowan">2. Рябиновый вечер</option><option value="city">3. Городской орнамент</option><option value="porcelain">4. Синий фарфор</option></select><small>Интерактивная демонстрация • тестовые сообщения</small><label>Канал источника</label><input id="target" value="city_deva"><label>Канал сообщения</label><input id="channel" value="city_deva"><label>Ник</label><input id="nick" value="city_guest"><label>Роль</label><select id="role"><option value="">Зритель</option><option value="mod">Модератор</option><option value="vip">VIP</option><option value="sub">Подписчик</option><option value="owner">Стример</option></select><label>Сообщение</label><input id="message" value="Добрый вечер, дорогие! 🌼"><label><input style="width:auto" type="checkbox" id="bot"> Сообщение бота</label><button id="send">Отправить сообщение</button><button id="auto">Автодемонстрация: вкл.</button><button id="bg">Переключить фон</button><button id="clear">Очистить чат</button><small id="status"></small><p><small>Подсветка: <span style="color:#b9d58a">зритель</span> · <span style="color:#79e4ae">модератор</span> · <span style="color:#df9df9">VIP</span> · <span style="color:#82d9f5">подписчик</span> · <span style="color:#ffd27a">стример</span></small></p></aside></main><script>const defaults={text:17,nick:16,textWeight:700,nickWeight:800,textColor:'#21150f',nickColor:'#21150f',roleNick:true,contrast:20,opacity:100,texture:100,gap:11,appear:550,move:420,owner:'#9e343b',mod:'#38694d',vip:'#9c416b',sub:'#365f91',viewer:'#776747',embroidery:true,symbols:true,particles:true,extraBots:''};const key='albielle-chat-settings-v1';function clean(v){let o={...defaults};for(const k in defaults){if(typeof defaults[k]==='number'){let n=Number(v[k]);if(v[k]!=null&&Number.isFinite(n))o[k]=k==='textWeight'||k==='nickWeight'?Math.max(400,Math.min(900,n)):k==='contrast'?Math.max(0,Math.min(100,n)):Math.max(0,Math.min(2000,n))}else if(typeof defaults[k]==='boolean'){if(typeof v[k]==='boolean')o[k]=v[k]}else if(k==='extraBots'){if(typeof v[k]==='string')o[k]=v[k].slice(0,4000)}else if(/^#[0-9a-f]{6}$/i.test(v[k]||''))o[k]=v[k]}return o}function load(){try{return clean(JSON.parse(localStorage.getItem(key)||'{}'))}catch{return {...defaults}}}let settings=load();function apply(v){settings=clean(v);const r=document.documentElement;for(const k of ['text','nick','gap'])r.style.setProperty('--cfg-'+k,settings[k]+'px');for(const k of ['appear','move'])r.style.setProperty('--cfg-'+k,settings[k]+'ms');for(const k of ['textWeight','nickWeight','textColor','nickColor'])r.style.setProperty('--cfg-'+k,settings[k]);r.style.setProperty('--cfg-contrast',settings.contrast/100+'px');document.body.dataset.roleNick=String(settings.roleNick);for(const k of ['owner','mod','vip','sub','viewer'])r.style.setProperty('--cfg-'+k,settings[k]);r.style.setProperty('--cfg-opacity',settings.opacity/100);r.style.setProperty('--cfg-texture',settings.texture/100);for(const k of ['embroidery','symbols','particles'])document.body.dataset[k]=String(settings[k]);}let artifactId=0;function decorate(el,r){const d=document.createElement('span');d.setAttribute('aria-hidden','true');const colors={owner:'#c65c54',mod:'#8da77a',vip:'#ce8a9e',sub:'#85a9d2'};const c=colors[r]||'#a88b54';d.innerHTML=`<svg class="medal" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M12 2L15 8 22 12 15 15 12 22 9 15 2 12 9 8Z M5 5L19 19M19 5L5 19"/><path d="M12 8L16 12 12 16 8 12Z"/></svg>`;d.insertAdjacentHTML('beforeend',`<svg class="folk-corner" viewBox="0 0 30 14" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M1 7L7 1 13 7 7 13Z M13 7L19 1 25 7 19 13Z M4 7H10M7 4V10M16 7H22M19 4V10"/></svg>`);el.append(d)}const $=id=>document.getElementById(id),stream=$('stream');const bots=new Set(['nightbot','streamelements','streamlabs','moobot','fossabot','wizebot','vsestream','sery_bot']);const norm=s=>s.trim().toLowerCase().replace(/^#/,'');let timer;function add(n,t,r='',c=$('target').value,b=false){if(b||settings.extraBots.split(/[\s,;]+/).map(norm).includes(norm(n))||bots.has(norm(n))||norm(c)!==norm($('target').value)){ $('status').textContent='Сообщение отфильтровано';return;}const old=[...stream.children],rects=old.map(x=>x.getBoundingClientRect().top);let el=document.createElement('div');el.className='msg new role-'+r;let name=document.createElement('span');name.className='nick';name.textContent=({mod:'⚔ ',vip:'♦ ',sub:'✦ ',owner:'♛ '}[r]||'')+n;el.append(name,document.createTextNode(t));decorate(el,r);const cloth=document.createElement("span");cloth.className="cloth";el.prepend(cloth);stream.append(el);const spell=document.createElement('span');spell.className='spell';spell.setAttribute('aria-hidden','true');for(let k=0;k<4;k++){const star=document.createElement('span');star.className='spark';star.textContent=k%3===0?'❀':'❧';const x=5+Math.random()*90,y=k%2?5:90;star.style.cssText=`--x:${x}%;--y:${y}%;--dx:${(Math.random()-.5)*65}px;--dy:${y<50?-25-Math.random()*30:15+Math.random()*25}px;--size:${8+Math.random()*12}px;--delay:${Math.random()*.18}s`;spell.append(star)}el.append(spell);setTimeout(()=>{spell.remove();el.classList.remove('new')},1400);old.forEach((x,i)=>{let d=rects[i]-x.getBoundingClientRect().top;x.animate([{transform:`translateY(${d}px)`},{transform:'translateY(0)'}],{duration:settings.move,easing:'ease-out'});});setTimeout(()=>{while(stream.children.length>1&&stream.firstElementChild.getBoundingClientRect().bottom<stream.parentElement.getBoundingClientRect().top-30)stream.firstElementChild.remove()},1500);$('status').textContent='Сообщение принято';}const params=new URLSearchParams(location.search);const channel=norm(params.get('channel')||'albielle');document.body.classList.add('overlay');document.body.dataset.theme='linen';$('target').value=channel;let ws,retry,attempt=0;function connect(){if(!/^[a-z0-9_]{1,25}$/.test(channel))return;ws=new WebSocket('wss://irc-ws.chat.twitch.tv:443');ws.onopen=()=>{ws.send('CAP REQ :twitch.tv/tags twitch.tv/commands');ws.send('PASS SCHMOOPIIE');ws.send('NICK justinfan'+Math.floor(100000+Math.random()*900000));ws.send('JOIN #'+channel);};ws.onmessage=e=>{for(const line of e.data.split(/\r?\n/)){if(line.startsWith('PING')){ws.send('PONG'+line.slice(4));continue;}if(line.includes(' 001 '))attempt=0;const m=line.match(/^@([^ ]+) :([^! ]+)![^ ]+ PRIVMSG #([^ ]+) :(.*)$/);if(!m)continue;const tags=Object.fromEntries(m[1].split(';').map(x=>{const i=x.indexOf('=');return [x.slice(0,i),x.slice(i+1)];}));if(norm(m[3])!==channel)continue;if(tags['source-room-id']&&tags['source-room-id']!==tags['room-id'])continue;const badges=(tags.badges||'').split(',');const has=x=>badges.some(b=>b.startsWith(x+'/'));const role=has('broadcaster')?'owner':has('moderator')?'mod':has('vip')?'vip':has('subscriber')||has('founder')?'sub':'';if(bots.has(norm(m[2]))||settings.extraBots.split(/[\s,;]+/).map(norm).includes(norm(m[2]))||has('bot'))continue;add(tags['display-name']||m[2],m[4],role,channel);}};ws.onerror=()=>ws.close();ws.onclose=()=>{clearTimeout(retry);retry=setTimeout(connect,Math.min(30000,1000*2**Math.min(attempt++,5)));};}for(const bot of ['clueland_bot','botrix','commanderroot','streamstickers','soundalerts','own3d','pretzelrocks','coebot'])bots.add(bot);for(const bot of (params.get('bots')||'').split(','))if(norm(bot))bots.add(norm(bot));let fixed=false;try{if(params.has('settings')){settings=clean(JSON.parse(params.get('settings')));fixed=true}}catch{}apply(settings);window.addEventListener('storage',e=>{if(!fixed&&e.key===key)apply(load())});window.addEventListener('message',e=>{if(params.has('preview')&&e.source===parent&&e.data?.type==='albielle-settings')apply(e.data.value)});if(params.has('preview')){const samples=[['albielle','Добрый вечер, дорогие!','owner'],['Хранитель','Устраивайтесь поудобнее!','mod'],['Почётный_гость','Чай уже готов!','vip'],['Василёк','Как же здесь уютно!','sub'],['Горожанин','Всем привет!','']];samples.forEach(x=>add(...x));let i=0;setInterval(()=>add(...samples[i++%samples.length]),4500)}else if(channel)connect();else if(!params.has('overlay')){const hint=document.createElement('div');hint.style.cssText='position:fixed;inset:12px;color:white;font:16px system-ui';hint.textContent='Укажите Twitch-канал в адресе: chat.html?channel=имя_канала';document.body.append(hint);}</script></html>
